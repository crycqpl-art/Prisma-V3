name: Build Prisma

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: Prisma (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: echo "VERSION=$(grep -oE 'project\(Prisma VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          else
            cmake -B build -G "Visual Studio 17 2022" -A x64
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect plugin files
        shell: bash
        run: |
          mkdir -p out
          cp -R build/Prisma_artefacts/Release/VST3/Prisma.vst3 out/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R build/Prisma_artefacts/Release/AU/Prisma.component out/
            codesign --force --deep -s - out/Prisma.vst3
            codesign --force --deep -s - out/Prisma.component
          fi
          cp INSTRUKCJA.md out/ || true
          echo "Prisma $VERSION" > out/VERSION.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Prisma-v${{ env.VERSION }}-${{ matrix.name }}
          path: out
